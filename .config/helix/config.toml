theme = "kanagawa"

[editor]
line-number = "relative"
cursorline = true
popup-border = "all"
clipboard-provider = "wayland"

[editor.statusline]
left = ["mode", "file-name", "spinner", "file-modification-indicator"]
center = ["diagnostics"]
right = ["selections", "position", "file-encoding", "file-type"]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.smart-tab]
enable = true

