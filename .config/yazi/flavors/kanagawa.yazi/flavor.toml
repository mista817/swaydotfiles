[app]
overall = { fg = "#dcd7ba", bg = "#1f1f28" }

[mgr]
cwd = { fg = "#e6c384" }

symlink_target = { fg = "#957fb8", italic = true }

find_keyword  = { fg = "#ffa066", bg = "#16161d" }
find_position = {}

marker_copied   = { fg = "#98bb6c", bg = "#98bb6c" }
marker_cut      = { fg = "#c34043", bg = "#c34043" }
marker_marked   = { fg = "#957fb8", bg = "#957fb8" }
marker_selected = { fg = "#ffa066", bg = "#ffa066" }

count_copied   = { fg = "#1f1f28", bg = "#98bb6c" }
count_cut      = { fg = "#1f1f28", bg = "#c34043" }
count_selected = { fg = "#1f1f28", bg = "#ffa066" }

border_symbol = "│"
border_style  = { fg = "#363646" }

[tabs]
active   = { fg = "#1f1f28", bg = "#7e9cd8" }
inactive = { fg = "#7e9cd8", bg = "#2a2a37" }

[mode]
normal_main = { fg = "#1f1f28", bg = "#7e9cd8" }
normal_alt  = { fg = "#7e9cd8", bg = "#2a2a37" }

select_main = { fg = "#1f1f28", bg = "#957fb8" }
select_alt  = { fg = "#957fb8", bg = "#2a2a37" }

unset_main  = { fg = "#1f1f28", bg = "#e6c384" }
unset_alt   = { fg = "#e6c384", bg = "#2a2a37" }

[indicator]
parent  = { bg = "#2a2a37" }
current = { bg = "#363646", bold = true }
preview = { bg = "#2a2a37" }

[status]
overall = { fg = "#dcd7ba", bg = "#16161d" }

perm_sep   = { fg = "#727169" }
perm_type  = { fg = "#98bb6c" }
perm_read  = { fg = "#e6c384" }
perm_write = { fg = "#c34043" }
perm_exec  = { fg = "#6a9589" }

progress_label  = { bold = true }
progress_normal = { fg = "#98bb6c", bg = "#16161d" }
progress_error  = { fg = "#e6c384", bg = "#16161d" }

[which]
border          = { fg = "#7e9cd8" }
border_set      = { as = "rounded" }
cols            = 3
mask            = {}
cand            = { fg = "#6a9589" }
rest            = { fg = "#727169" }
desc            = { fg = "#d27e99" }
separator       = " > "
separator_style = { fg = "#727169" }

[confirm]
border     = { fg = "#c34043" }
border_set = { as = "rounded" }
title      = { fg = "#c34043" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border     = { fg = "#7e9cd8" }
border_set = { as = "rounded" }
title      = { fg = "#7e9cd8" }

tbl_col  = { fg = "#7e9cd8" }
tbl_cell = { fg = "#e6c384", reversed = true }

[notify]
border_set = { as = "rounded" }

title_info  = { fg = "#98bb6c" }
title_warn  = { fg = "#e6c384" }
title_error = { fg = "#c34043" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[pick]
border     = { fg = "#7e9cd8" }
border_set = { as = "rounded" }
active     = { fg = "#d27e99", bold = true }
inactive   = {}

[input]
border     = { fg = "#7e9cd8" }
border_set = { as = "rounded" }
title      = {}
value      = {}
selected   = { reversed = true }

[cmp]
border     = { fg = "#7e9cd8" }
border_set = { as = "rounded" }
active     = { reversed = true }
inactive   = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border     = { fg = "#7e9cd8" }
border_set = { as = "rounded" }
title      = {}
hovered    = { fg = "#d27e99", bold = true }

[help]
border     = { fg = "#7e9cd8" }
border_set = { as = "rounded" }
chord      = { fg = "#6a9589" }
action     = {}
hovered    = { reversed = true, bold = true }

[fd]
title    = "Search via fd:"
position = { at = "top-center", y = 2, w = 80, h = 3 }

[rg]
title    = "Search via rg:"
position = { at = "top-center", y = 2, w = 80, h = 3 }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#e6c384" },
	{ mime = "**/{audio,video}/*", fg = "#d27e99" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c34043" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#6a9589" },
	{ mime = "vfs/{absent,stale}", fg = "#727169" },
	{ mime = "inode/empty", fg = "#727169" },
	{ url = "*", is = "orphan", bg = "#c34043" },
	{ url = "*", is = "exec"  , fg = "#98bb6c" },
	{ url = "*", is = "dummy", bg = "#c34043" },
	{ url = "*/", is = "dummy", bg = "#c34043" },
	{ url = "*/", fg = "#7e9cd8" }
]

